<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <title>AI Rhyme Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Rhyme Generator</h1>
      </header>
      <main>
        <div class="form-container">
          <form id="rhyme-generator-form">
            <input
              type="text"
              placeholder="Type any words to generate the Rhyme"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i.e: Sky, Coffee or Japan</div>
        </div>
        <div class="rhyme hidden" id="rhyme"></div>
      </main>
      <footer>
        This AI Project was coded by
        <a href="https://github.com/demib999" target="_blank">Demi Browne </a>
        and is
        <a href="https://github.com/demib999/rhyme-generator" target="_blank"
          >open-sourced on GitHub</a
        >
        and is
        <a href="https://ai-rhyme-generator.netlify.app" target="_blank"
          >hosted on Netlify</a
        >
      </footer>
    </div>
    <script script src="src/script.js"></script>
  </body>
</html>
