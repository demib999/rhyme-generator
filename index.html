<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Rhyme Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Rhyme Generator</h1>
      </header>
      <main>
        <form>
          <input
            type="text"
            placeholder="Enter the Rhyme topic"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="rhyme">
          Tell me not, in mournful numbers <br />
          Life is but an empty dream! <br />
          For the soul is dead that slumbers <br />
          And things are not what they seem
        </div>
      </main>
      <footer>
        This AI Project was coded by
        <a href="https://github.com/demib999" target="_blank">Demi Browne </a>
        and is
        <a href="https://github.com/demib999/rhyme-generator" target="_blank"
          >open-sourced on GitHub</a
        >
        and is
        <a href="https://ai-rhyme-generator.netlify.app" target="_blank"
          >hosted on Netlify</a
        >
      </footer>
    </div>
    <script script src="src/script.js"></script>
  </body>
</html>
